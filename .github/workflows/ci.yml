name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Tauri environment
        run: npx tauri info
      - name: Tauri crate and npm versions match
        run: npm run check:tauri-versions

  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            experimental: false
          # Cyrus SASL / GSSAPI do not build on MSVC yet; allowed to fail until
          # the Kafka client is switched to vendored, self-contained native deps.
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            experimental: true
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            experimental: false
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            experimental: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libssl-dev libsasl2-dev libkrb5-dev
      - run: npm ci
      # tauri::generate_context! embeds the built frontend, so it must exist before cargo runs.
      - run: npm run build
      - name: cargo fmt
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.target }}
