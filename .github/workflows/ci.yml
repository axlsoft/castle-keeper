name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Tauri environment
        run: npx tauri info
      - name: Tauri crate and npm versions match
        run: npm run check:tauri-versions

  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # tauri::generate_context! embeds the built frontend, so it must exist before cargo runs.
      - run: npm run build
      - name: cargo fmt
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.target }}
      # Unsigned installers/bundles for each target.
      - name: tauri build
        run: npx tauri build --ci --target ${{ matrix.target }}
      - name: Dynamic linkage
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   ldd src-tauri/target/${{ matrix.target }}/release/castle-keeper ;;
            macOS)   otool -L src-tauri/target/${{ matrix.target }}/release/castle-keeper ;;
            Windows)
              vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
              dumpbin="$("$vswhere" -latest -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | head -n1)"
              "$dumpbin" /dependents src-tauri/target/${{ matrix.target }}/release/castle-keeper.exe ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: castle-keeper-${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  kerberos:
    name: Kerberos feature (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: kerberos
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libsasl2-dev libkrb5-dev
      - run: npm ci && npm run build
      - working-directory: src-tauri
        run: cargo check --features kerberos

  integration:
    name: Integration (local Kafka)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: integration
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci && npm run build
      - name: cargo test against local brokers
        run: bash scripts/test-integration.sh
      - if: failure()
        run: docker compose --profile sasl logs
