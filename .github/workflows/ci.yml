name: CI

# What runs when is decided by .github/scripts/ci-plan.sh (see its header):
# pull requests check only what changed and build no installers; main and
# release tags build installers; manual runs pick their platforms.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly Linux run, which includes the Kerberos build.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated: linux-x86_64, windows-x86_64, macos-arm64, macos-x86_64, or all"
        type: string
        default: all
      bundles:
        description: "Build release installers"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs only read the repository, except the release job, which creates a
# draft GitHub Release for v* tags.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Test and clippy builds don't need full debug info; this mostly saves
  # link time (noticeably on Windows).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.plan.outputs.frontend }}
      rust: ${{ steps.plan.outputs.rust }}
      kerberos: ${{ steps.plan.outputs.kerberos }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pull requests diff against their base commit.
          fetch-depth: 0
      # Fail before building anything if the tag doesn't match the app version.
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-version.mjs --tag "$GITHUB_REF_NAME"
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PLATFORMS: ${{ inputs.platforms }}
          BUNDLES: ${{ inputs.bundles }}
        run: bash .github/scripts/ci-plan.sh

  frontend:
    name: Frontend
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Tauri environment
        run: npx tauri info
      - name: Tauri crate and npm versions match
        run: npm run check:tauri-versions
      - name: App version matches across files
        run: npm run check:version

  rust:
    name: Rust (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # tauri::generate_context! embeds the built frontend, so it must exist before cargo runs.
      - run: npm run build
      - name: cargo fmt
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.target }}
      # Unsigned installers/bundles; only when the plan asks for them.
      - name: tauri build
        if: matrix.bundle
        run: npx tauri build --ci --target ${{ matrix.target }}
      - name: Dynamic linkage
        if: matrix.bundle
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   ldd src-tauri/target/${{ matrix.target }}/release/castle-keeper ;;
            macOS)   otool -L src-tauri/target/${{ matrix.target }}/release/castle-keeper ;;
            Windows)
              vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
              dumpbin="$("$vswhere" -latest -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | head -n1)"
              "$dumpbin" -dependents src-tauri/target/${{ matrix.target }}/release/castle-keeper.exe ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.bundle
        with:
          name: castle-keeper-${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  kerberos:
    name: Kerberos feature (Linux)
    needs: plan
    if: needs.plan.outputs.kerberos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: kerberos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libsasl2-dev libkrb5-dev
      - run: npm ci && npm run build
      - working-directory: src-tauri
        run: cargo check --features kerberos

  integration:
    name: Integration (local Kafka)
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: integration
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci && npm run build
      - name: cargo test against local brokers
        run: bash scripts/test-integration.sh
      - if: failure()
        run: docker compose --profile sasl logs

  # One stable check for branch protection: jobs the plan skips report as
  # "skipped", so require this instead of the individual jobs.
  result:
    name: CI result
    needs: [plan, frontend, rust, kerberos, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All planned jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A job finished with: $result"; exit 1 ;;
            esac
          done

  # v* tags: once everything has passed, attach the installers to a draft
  # GitHub Release. Publishing it stays a manual step.
  release:
    name: Draft release
    needs: [rust, result]
    if: startsWith(github.ref, 'refs/tags/v') && needs.rust.result == 'success' && needs.result.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: castle-keeper-*
          path: bundles
      - name: Collect installers
        run: |
          mkdir dist
          # -type f skips .app bundles (directories, shipped inside the .dmg)
          # and the AppImage build folder.
          find bundles -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          # Linux .deb/.rpm/.AppImage, Windows .msi/setup.exe, macOS arm64 and x86_64 .dmg.
          count=$(wc -l < SHA256SUMS)
          if [ "$count" -ne 7 ]; then echo "Expected 7 installers, found $count"; exit 1; fi
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of a tag build: refresh the files on the existing release.
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=()
            [[ "$version" == *-* ]] && prerelease=(--prerelease)
            gh release create "$TAG" dist/* --draft --verify-tag --generate-notes \
              --title "Castle Keeper $version" "${prerelease[@]}"
          fi
