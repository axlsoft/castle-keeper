version: 2

# Tauri crates and their @tauri-apps/* npm packages must share major.minor,
# or `tauri build` refuses to run. Update them together in one PR.
multi-ecosystem-groups:
  tauri:
    schedule:
      interval: "weekly"

updates:
  # Frontend dependencies (package.json at the repo root).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    multi-ecosystem-group: "tauri"
    patterns: ["@tauri-apps/*"]
    groups:
      svelte:
        patterns: ["svelte", "svelte-check", "@sveltejs/*", "bits-ui", "mode-watcher", "svelte-sonner", "@lucide/svelte"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "tailwind-merge", "tailwind-variants", "tw-animate-css"]

  # Rust backend. Cargo.toml lives in src-tauri/, not the repo root.
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    multi-ecosystem-group: "tauri"
    patterns: ["tauri", "tauri-build", "tauri-plugin-*"]
    groups:
      kafka:
        patterns: ["rdkafka", "rdkafka-sys"]
      rust-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
