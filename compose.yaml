# Local single-node Kafka (KRaft) for development and integration tests.
# Listens on 127.0.0.1:9092 only. See CONTRIBUTING.md.
name: castle-keeper

services:
  kafka:
    image: docker.io/apache/kafka:4.3.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 127.0.0.1 rather than localhost: the port is published on IPv4 only, and
      # clients would otherwise try ::1 first and log a refused connection.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      # A plain TCP probe: the client listener opens once the broker is serving.
      # (kafka-broker-api-versions.sh starts a JVM on every check.)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9092"]
      interval: 5s
      timeout: 5s
      retries: 24

  # SASL broker for auth tests: PLAIN and SCRAM-SHA-256/512 on 127.0.0.1:9094.
  # Start with `docker compose --profile sasl up -d --wait`.
  kafka-sasl:
    image: docker.io/apache/kafka:4.3.1
    profiles: [sasl]
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - ./dev/kafka/sasl-jaas.conf:/etc/kafka/sasl-jaas.conf:ro
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,SASL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-sasl:19092,SASL://127.0.0.1:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,SASL:SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/sasl-jaas.conf
    healthcheck:
      # A plain TCP probe: the client listener opens once the broker is serving.
      # (kafka-broker-api-versions.sh starts a JVM on every check.)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/19092"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Creates the SCRAM user once the SASL broker is up.
  kafka-sasl-users:
    image: docker.io/apache/kafka:4.3.1
    profiles: [sasl]
    depends_on:
      kafka-sasl:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # Kafka rejects two SCRAM mechanisms for one user in a single request.
    command:
      - >-
        for m in SCRAM-SHA-256 SCRAM-SHA-512; do
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka-sasl:19092 --alter
        --entity-type users --entity-name alice --add-config "$$m=[password=alice-secret]" || exit 1;
        done
