[package]
name = "castle-keeper"
version = "0.1.0"
description = "An Apache Kafka management client."
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "castle_keeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# SASL/GSSAPI (Kerberos) through the system Cyrus SASL and krb5 libraries.
# Unix only and off by default: it adds a dynamic dependency on libsasl2.
# Windows (SSPI) Kerberos is not supported.
kerberos = ["rdkafka/gssapi"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-store = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OpenSSL and zlib are compiled in so the app has no Homebrew/system
# OpenSSL dependency. librdkafka implements SASL/PLAIN and SCRAM itself;
# Cyrus SASL is only needed for Kerberos (see the `kerberos` feature).
rdkafka = { version = "0.39", features = ["ssl-vendored", "libz-static", "tracing"] }

# librdkafka's configure/make build doesn't support MSVC; use CMake there.
[target.'cfg(windows)'.dependencies]
rdkafka = { version = "0.39", features = ["cmake-build"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"


